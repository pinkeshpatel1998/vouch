<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vouch embed — layouts</title>
<style>
  body{background:#faf8f5;color:#1a1614;margin:0;padding:32px;
       font-family:ui-sans-serif,system-ui,sans-serif;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;opacity:.5;margin:40px 0 12px;}
  h2:first-of-type{margin-top:0;}
</style>
</head>
<body>
  <h2>Carousel — rail</h2>
  <script src="/embed.js" data-wall="demo" data-api="/api/walls/demo?layout=carousel&amp;style=rail" async></script>

  <h2>Carousel — marquee</h2>
  <script src="/embed.js" data-wall="demo" data-api="/api/walls/demo?layout=carousel&amp;style=marquee" async></script>

  <h2>Carousel — spotlight</h2>
  <script src="/embed.js" data-wall="demo" data-api="/api/walls/demo?layout=carousel&amp;style=spotlight" async></script>

  <h2>Single</h2>
  <script src="/embed.js" data-wall="demo" data-api="/api/walls/demo?layout=single" async></script>

  <h2>Masonry, forced dark</h2>
  <script src="/embed.js" data-wall="demo" data-api="/api/walls/demo?theme=dark" async></script>
</body>
</html>
